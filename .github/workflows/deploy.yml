# main 에 머지되면 정식 사이트를 gh-pages 브랜치 루트에 배포한다.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: .github/scripts/build.sh
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          NOINDEX: ${{ vars.SITE_NOINDEX }}

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
          branch: gh-pages
          # PR 미리보기 폴더는 지우지 않는다
          clean-exclude: pr-preview
          force: false
